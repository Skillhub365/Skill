# TLS termination and WebSocket upgrade for the Guacamole gateway.
# Public surface is exactly one port: 443.

server {
    listen 443 ssl;
    http2 on;
    server_name labs.skilltracklabs.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The client is embedded inside the SkillTrack VM workspace.
    add_header Content-Security-Policy "frame-ancestors https://app.skilltracklabs.com https://*.skilltracklabs.com" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://guacamole:8080/guacamole/;
        proxy_buffering off;
        proxy_http_version 1.1;

        # WebSocket tunnel (WSS) used for keyboard, mouse, display and clipboard.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }
}

map $http_upgrade $http_connection {
    default upgrade;
    ''      close;
}
